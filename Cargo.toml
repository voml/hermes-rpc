[workspace]
resolver = "2"
# Hermes workspace: RPC domain runtime (`hermes-runtime`), code generator
# (`hermes-generator`), N-API binding (`hermes-napi`) and WebAssembly binding
# (`hermes-wasm`). VOS projection
# artifacts come from upstream `vos-types` (`vos-language`); Hermes does not
# vendor a local mirror crate.
members = [
    "projects/hermes.rs/crates/hermes-runtime",
    "projects/hermes.rs/crates/hermes-generator",
    "projects/hermes.rs/crates/hermes-napi",
    "projects/hermes.rs/crates/hermes-wasm",
    "projects/hermes.rs/crates/hermes-transport-http",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
vos-types = { git = "https://github.com/voml/vos-language.git", rev = "67c70cb119ce3dcc55ca7ba607014a49c9c9614e" }
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-service = "0.3"

[profile.release]
lto = true
panic = "abort"
