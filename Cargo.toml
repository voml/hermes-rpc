[workspace]
resolver = "2"
# Hermes workspace: VOS language host (`vos-core`), RPC domain runtime
# (`hermes-runtime`), the code generator (`hermes-generator`) and the N-API
# binding (`hermes-napi`).
# 旧栈（`vos-ast` / `vos-for-rust` / `vos-cli` / `vos-openapi` / `vos-faker`）已冻结并移出 workspace。
members = [
    "projects/vos-core",
    "projects/hermes-runtime",
    "projects/hermes-generator",
    "projects/hermes-napi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
panic = "abort"
