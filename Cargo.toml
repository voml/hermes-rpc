[workspace]
resolver = "2"
# Hermes workspace: RPC domain runtime (`hermes-runtime`), code generator
# (`hermes-generator`) and N-API binding (`hermes-napi`). VOS projection
# artifacts come from upstream `vos-types` (`vos-language`); Hermes does not
# vendor a local mirror crate.
members = [
    "projects/hermes.rs/crates/hermes-runtime",
    "projects/hermes.rs/crates/hermes-generator",
    "projects/hermes.rs/crates/hermes-napi",
    "projects/hermes.rs/crates/hermes-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Aster <192607617@qq.com>"]
license = "MPL-2.0"

[workspace.dependencies]
vos-types = { git = "https://github.com/voml/vos-language.git", branch = "dev" }
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
lto = true
panic = "abort"
