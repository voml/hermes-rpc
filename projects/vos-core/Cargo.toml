[package]
name = "vos-core"
version = "0.2.0"
authors = ["Aster <192607617@qq.com>"]
description = "Hermes core types and VOS ServiceContract consumer"
repository = "https://github.com/voml/hermes-rpc"
documentation = "https://docs.rs/vos-core"
readme = "Readme.md"
license = "MPL-2.0"
edition = "2024"

[dependencies]
indenter = { version = "0.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "1", features = ["serde"] }
voml-collection = "0.3"
rand = { version = "0.8", optional = true, features = ["small_rng"] }
chrono = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
rust_decimal = "1"
semver = { version = "1", features = ["serde"] }
sha2 = "0.10"
url = { version = "2", features = ["serde"] }
email_address = "0.2"

# Hermes 消费的 VOS ServiceContract artifact 来自 `vos-language`。
# TODO(hermes): 等 `vos` crate 导出 `ServiceContract` 后，将本 crate 内的
# 本地占位 trait（`HermesServiceContract` 等）替换为从 `vos` 导入的正式类型。

[dev-dependencies]

[features]
default = []
faker = ["rand"]
validator = []
